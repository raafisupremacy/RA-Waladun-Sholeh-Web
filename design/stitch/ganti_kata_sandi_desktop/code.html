<div class="w-full flex flex-col items-center justify-center pb-24">
<!-- Header Section -->
<header class="w-full max-w-[680px] mx-auto text-center pt-[76px] px-6">
<h1 class="font-headline-hero text-[48px] leading-[1.15] font-semibold text-text-primary tracking-[-0.02em]">
        Ganti kata sandi
      </h1>
<p class="font-body-parent text-[19px] leading-[1.47] font-normal text-text-secondary mt-4 max-w-[540px] mx-auto">
        Kata sandi sementara dari sekolah perlu diganti sebelum Anda melanjutkan.
      </p>
</header>
<!-- Centered Form Container (Strict 360px) -->
<main class="w-full max-w-[360px] mx-auto mt-12 px-0">
<form class="w-full flex flex-col" id="password-form" onsubmit="return false;">
<!-- Field 1: Kata Sandi Sementara -->
<div class="flex flex-col">
<label class="block text-[14px] leading-tight font-medium text-text-secondary mb-2 text-left select-none" for="temp-password">
            Kata sandi sementara
          </label>
<div class="relative w-full">
<input autocomplete="current-password" class="w-full h-12 px-4 rounded-xl text-[16px] text-text-primary placeholder:text-text-tertiary bg-surface transition-all duration-150 shadow-[inset_0_0_0_1px_#E5E5EA] focus:shadow-[inset_0_0_0_1px_#0071E3,0_0_0_3px_rgba(0,113,227,0.25)] focus:outline-none" id="temp-password" placeholder="••••••••" type="password" value="Tunas2026!">
<button aria-label="Tampilkan kata sandi sementara" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-text-secondary transition-colors p-1 flex items-center justify-center" onclick="toggleVisibility('temp-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Field 2: Kata Sandi Baru -->
<div class="flex flex-col mt-6">
<label class="block text-[14px] leading-tight font-medium text-text-secondary mb-2 text-left select-none" for="new-password">
            Kata sandi baru
          </label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-12 px-4 rounded-xl text-[16px] text-text-primary placeholder:text-text-tertiary bg-surface transition-all duration-150 shadow-[inset_0_0_0_1px_#E5E5EA] focus:shadow-[inset_0_0_0_1px_#0071E3,0_0_0_3px_rgba(0,113,227,0.25)] focus:outline-none" id="new-password" placeholder="••••••••••" type="password">
<button aria-label="Tampilkan kata sandi baru" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-text-secondary transition-colors p-1 flex items-center justify-center" onclick="toggleVisibility('new-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Strict Rule Checklist -->
<ul aria-label="Syarat kata sandi" class="flex flex-col gap-2 mt-3 list-none p-0 m-0">
<!-- Rule 1: Minimal 8 karakter (MET condition) -->
<li class="flex items-center gap-2" id="rule-length">
<span class="w-4 h-4 rounded-full bg-status-lunas-bg flex items-center justify-center flex-shrink-0 text-status-lunas-text">
<svg class="w-2.5 h-2.5 fill-none stroke-current stroke-[2.5]" viewBox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</span>
<span class="text-[14px] leading-none text-status-lunas-text font-normal">
                Minimal 8 karakter
              </span>
</li>
<!-- Rule 2: Ada angka (UNMET condition) -->
<li class="flex items-center gap-2" id="rule-number">
<span class="w-4 h-4 rounded-full shadow-[inset_0_0_0_1px_#86868B] bg-transparent flex items-center justify-center flex-shrink-0"></span>
<span class="text-[14px] leading-none text-text-secondary font-normal">
                Ada angka
              </span>
</li>
</ul>
</div>
<!-- Field 3: Konfirmasi Kata Sandi -->
<div class="flex flex-col mt-6">
<label class="block text-[14px] leading-tight font-medium text-text-secondary mb-2 text-left select-none" for="confirm-password">
            Konfirmasi kata sandi
          </label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-12 px-4 rounded-xl text-[16px] text-text-primary placeholder:text-text-tertiary bg-surface transition-all duration-150 shadow-[inset_0_0_0_1px_#E5E5EA] focus:shadow-[inset_0_0_0_1px_#0071E3,0_0_0_3px_rgba(0,113,227,0.25)] focus:outline-none" id="confirm-password" placeholder="Ulangi kata sandi baru" type="password">
<button aria-label="Tampilkan konfirmasi kata sandi" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-text-secondary transition-colors p-1 flex items-center justify-center" onclick="toggleVisibility('confirm-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[52px] mt-9 rounded-full bg-primary-container text-on-primary text-[17px] font-semibold leading-none flex items-center justify-center transition-all duration-150 hover:bg-accent-hover active:scale-[0.98] select-none" id="submit-btn" type="submit">
          Simpan dan lanjut
        </button>
<!-- Secondary Polite Contact Link -->
<div class="mt-5 text-center">
<span class="text-[14px] leading-none text-text-secondary font-normal select-none">
            Butuh bantuan?
          </span>
<a class="text-[14px] leading-none text-primary-container font-normal hover:underline ml-1 inline-block" href="mailto:tatausaha@tktunasharapan.sch.id">
            Hubungi Tata Usaha
          </a>
</div>
</form>
</main>
</div>
</div>
<script>
  function toggleVisibility(inputId, triggerBtn) {
    const input = document.getElementById(inputId);
    const icon = triggerBtn.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  const newPassInput = document.getElementById('new-password');
  const ruleLength = document.getElementById('rule-length');
  const ruleNumber = document.getElementById('rule-number');

  if (newPassInput && ruleLength && ruleNumber) {
    newPassInput.addEventListener('input', function() {
      const val = this.value;
      const hasLength = val.length >= 8;
      const hasNumber = /\d/.test(val);

      if (hasLength) {
        ruleLength.innerHTML = `
          <span class="w-4 h-4 rounded-full bg-status-lunas-bg flex items-center justify-center flex-shrink-0 text-status-lunas-text">
            <svg class="w-2.5 h-2.5 fill-none stroke-current stroke-[2.5]" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span class="text-[14px] leading-none text-status-lunas-text font-normal">Minimal 8 karakter</span>
        `;
      } else {
        ruleLength.innerHTML = `
          <span class="w-4 h-4 rounded-full shadow-[inset_0_0_0_1px_#86868B] bg-transparent flex items-center justify-center flex-shrink-0"></span>
          <span class="text-[14px] leading-none text-text-secondary font-normal">Minimal 8 karakter</span>
        `;
      }

      if (hasNumber) {
        ruleNumber.innerHTML = `
          <span class="w-4 h-4 rounded-full bg-status-lunas-bg flex items-center justify-center flex-shrink-0 text-status-lunas-text">
            <svg class="w-2.5 h-2.5 fill-none stroke-current stroke-[2.5]" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span class="text-[14px] leading-none text-status-lunas-text font-normal">Ada angka</span>
        `;
      } else {
        ruleNumber.innerHTML = `
          <span class="w-4 h-4 rounded-full shadow-[inset_0_0_0_1px_#86868B] bg-transparent flex items-center justify-center flex-shrink-0"></span>
          <span class="text-[14px] leading-none text-text-secondary font-normal">Ada angka</span>
        `;
      }
    });
  }
</script></main><footer class="w-full bg-bg-canvas border-t border-separator py-space-md"><div class="max-w-[1440px] mx-auto px-space-xl text-center font-caption text-caption text-text-secondary select-none">© 2026 TK Tunas Harapan · Sistem Informasi dan Keuangan Sekolah</div></footer></body></html>
