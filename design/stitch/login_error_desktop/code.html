<div class="w-full max-w-[360px] flex flex-col items-center select-none">
<div class="text-center mb-[40px]">
<h1 class="font-headline-hero text-headline-hero text-text-primary tracking-[-0.02em] mb-space-xs">

      </h1>
<p class="font-subhead text-subhead text-text-secondary tracking-normal">
        TK Tunas Harapan
      </p>
</div>
<div class="w-full mb-space-lg flex items-center gap-space-sm px-space-md py-space-sm bg-status-ditolak-bg rounded-xl text-status-ditolak-text transition-all duration-200">
<span class="material-symbols-outlined text-[18px] leading-none select-none" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-label-regular text-[14px] leading-tight font-medium">
        Email atau kata sandi tidak sesuai.
      </span>
</div>
<form class="w-full flex flex-col gap-space-lg" novalidate="" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs text-left w-full">
<label class="font-label-regular text-label-regular text-text-secondary" for="email">
          Email
        </label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-[48px] px-space-md bg-surface text-text-primary font-body-default text-body-default rounded-xl outline-none transition-shadow shadow-[0_0_0_1px_#C4271B] focus:shadow-[0_0_0_3px_rgba(196,39,27,0.25)]" id="email" name="email" type="email" value="budi@tunasharapan.sch.id">
</div>
</div>
<div class="flex flex-col gap-space-xs text-left w-full">
<div class="flex items-center justify-between">
<label class="font-label-regular text-label-regular text-text-secondary" for="password">
            Kata Sandi
          </label>
</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-[48px] pl-space-md pr-[58px] bg-surface text-text-primary font-body-default text-body-default rounded-xl outline-none transition-shadow shadow-[0_0_0_1px_#C4271B] focus:shadow-[0_0_0_3px_rgba(196,39,27,0.25)]" id="password" name="password" type="password" value="RahasiaSekolah">
<button class="absolute right-space-md h-full flex items-center font-label-regular text-[13px] text-link hover:text-accent-hover active:opacity-70 transition-opacity" id="togglePassword" type="button">
            Lihat
          </button>
</div>
<span class="font-label-regular text-[13px] text-status-ditolak-text pt-space-xs">
          Email atau kata sandi tidak sesuai.
        </span>
</div>
<div class="pt-space-xs flex flex-col items-center gap-space-md w-full">
<button class="w-full h-[44px] bg-primary-container hover:bg-accent-hover active:scale-[0.98] text-on-primary font-label-regular text-body-default font-medium rounded-full flex items-center justify-center transition-all duration-150 cursor-pointer shadow-sm" type="submit">
          Masuk
        </button>
<a class="font-label-regular text-label-regular text-link hover:underline transition-all" href="#">
          Lupa kata sandi?
        </a>
</div>
</form>
<div class="mt-[56px] text-center w-full">
<p class="font-label-regular text-label-regular text-text-secondary leading-relaxed">
        Akun dibuat oleh Tata Usaha. Belum punya akun? <a class="text-link hover:underline" href="#">Hubungi sekolah</a>.
      </p>
</div>
</div>
<script>
    (function() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.textContent = isPassword ? 'Sembunyikan' : 'Lihat';
        });
      }
    })();
  </script>
</div></div></main></body></html>
