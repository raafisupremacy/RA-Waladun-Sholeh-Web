  </head><body class="bg-surface font-body-default text-text-primary min-h-screen flex flex-col antialiased selection:bg-accent-soft selection:text-primary"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_0_0_#E5E5EA] pt-safe"><div class="h-12 max-w-[680px] mx-auto px-margin-mobile flex items-center justify-between"><span class="text-[14px] leading-[18px] font-semibold tracking-tight text-text-primary select-none">SKMS</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full max-w-[680px] mx-auto pt-12 pb-safe bg-surface"><div class="flex flex-col w-full px-margin-mobile pt-space-lg pb-space-xl">
<div class="flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-accent-soft flex items-center justify-center mb-space-md text-primary">
<span class="material-symbols-outlined text-[24px]">lock</span>
</div>
<h1 class="font-headline-hero-mobile text-headline-hero-mobile text-text-primary tracking-[-0.02em] leading-[1.15]">
      Masuk ke SKMS
    </h1>
<p class="font-subhead-mobile text-subhead-mobile text-text-secondary mt-2 mb-9">
      TK Tunas Harapan
    </p>
</div>
<form class="w-full flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-regular text-label-regular text-text-secondary" for="email">
        Email
      </label>
<div class="relative w-full rounded-xl bg-surface-container-low transition-all duration-150 focus-within:bg-surface focus-within:shadow-[0_0_0_2px_#0071E3]">
<input autocomplete="email" class="w-full h-12 px-4 bg-transparent rounded-xl text-[16px] text-text-primary placeholder:text-text-tertiary focus:outline-none" id="email" inputmode="email" placeholder="nama@sekolah.sch.id" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-regular text-label-regular text-text-secondary" for="password">
        Kata Sandi
      </label>
<div class="relative w-full rounded-xl bg-surface-container-low flex items-center transition-all duration-150 focus-within:bg-surface focus-within:shadow-[0_0_0_2px_#0071E3]">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-16 bg-transparent rounded-xl text-[16px] text-text-primary placeholder:text-text-tertiary focus:outline-none" id="password" placeholder="Masukkan kata sandi" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-4 text-[14px] font-medium text-primary hover:text-accent-hover transition-colors select-none py-1 focus:outline-none" id="togglePassword" type="button">
          Lihat
        </button>
</div>
</div>
<div class="pt-3 flex flex-col items-center gap-5">
<button class="w-full h-12 rounded-full bg-primary-container hover:bg-accent-hover text-on-primary font-medium text-[17px] flex items-center justify-center tracking-tight transition-transform active:scale-[0.98] select-none" type="submit">
        Masuk
      </button>
<a class="font-body-default text-[15px] text-link hover:underline transition-opacity active:opacity-70 select-none" href="#">
        Lupa kata sandi?
      </a>
</div>
</form>
<div class="mt-14 pt-4 flex flex-col items-center text-center">
<p class="font-caption text-caption text-text-secondary max-w-[280px] leading-relaxed">
      Akun dibuat oleh Tata Usaha. Belum punya akun? <a class="text-link hover:underline" href="#">Hubungi sekolah</a>.
    </p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.textContent = isPassword ? 'Tutup' : 'Lihat';
      });
    }
  })();
</script></main></body></html>
