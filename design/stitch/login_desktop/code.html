7px",{lineHeight:"24px",fontWeight:"400"}],"headline-section-mobile":["24px",{lineHeight:"30px",letterSpacing:"-0.01em",fontWeight:"600"}],"headline-section":["40px",{lineHeight:"46px",letterSpacing:"-0.015em",fontWeight:"600"}],"label-regular":["13px",{lineHeight:"18px",fontWeight:"500"}]}}}}</script></head><body class="bg-surface font-body-default text-text-primary antialiased min-h-screen flex flex-col"><header class="fixed top-0 left-0 right-0 z-50 h-11 bg-surface/80 backdrop-blur-[20px] border-b border-separator"><div class="h-11 w-full max-w-[1200px] mx-auto px-gutter flex items-center justify-between"><a class="text-[14px] font-semibold tracking-tight text-text-primary select-none" data-path="login" href="#">SKMS</a></div></header><main class="flex-1 w-full pt-11 bg-surface flex flex-col items-center justify-center"><div class="w-full max-w-[680px] px-gutter py-space-xl flex flex-col items-center"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<div class="w-full flex flex-col items-center text-center select-none">
<h1 class="font-headline-hero text-headline-hero text-text-primary tracking-[-0.02em] leading-[1.1]">
      Masuk ke SKMS
    </h1>
<p class="font-subhead text-subhead text-text-secondary mt-3 mb-12">
      RA Waladun Sholeh
    </p>
</div>
<form class="w-full max-w-[360px] flex flex-col" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col w-full">
<label class="font-label-regular text-label-regular text-text-secondary mb-2 block text-left" for="email">
        Email
      </label>
<input autocomplete="email" class="w-full h-12 px-4 rounded-xl bg-surface text-text-primary font-body-default text-body-default outline-none transition-all placeholder:text-text-tertiary shadow-sm focus:shadow-md" id="email" onblur="this.style.boxShadow = 'inset 0 0 0 1px #E5E5EA'" onfocus="this.style.boxShadow = 'inset 0 0 0 1px #0071E3, 0 0 0 3px rgba(0, 113, 227, 0.25)'" placeholder="nama@sekolah.sch.id" required="" style="box-shadow: inset 0 0 0 1px #E5E5EA;" type="email">
</div>
<div class="flex flex-col w-full mt-5">
<div class="flex items-center justify-between mb-2">
<label class="font-label-regular text-label-regular text-text-secondary block text-left" for="password">
          Kata Sandi
        </label>
</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-[60px] rounded-xl bg-surface text-text-primary font-body-default text-body-default outline-none transition-all placeholder:text-text-tertiary shadow-sm focus:shadow-md" id="password" onblur="this.style.boxShadow = 'inset 0 0 0 1px #E5E5EA'" onfocus="this.style.boxShadow = 'inset 0 0 0 1px #0071E3, 0 0 0 3px rgba(0, 113, 227, 0.25)'" placeholder="••••••••" required="" style="box-shadow: inset 0 0 0 1px #E5E5EA;" type="password">
<button class="absolute right-4 text-eval-bsb font-label-regular text-label-regular font-medium hover:text-accent-hover transition-colors focus:outline-none select-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
          Lihat
        </button>
</div>
</div>
<button class="w-full h-11 mt-7 rounded-full bg-primary-container text-on-primary font-body-default text-[16px] font-medium transition-transform duration-150 active:scale-[0.98] hover:bg-accent-hover flex items-center justify-center select-none" id="submitBtn" type="submit">
      Masuk
    </button>
<div class="w-full text-center mt-5">
<a class="font-body-default text-[14px] text-link hover:underline transition-all select-none" href="#" onclick="event.preventDefault();">
        Lupa kata sandi?
      </a>
</div>
</form>
<div class="mt-20 text-center">
<p class="font-label-regular text-label-regular text-text-secondary leading-relaxed select-none">
      Akun dibuat oleh Tata Usaha. Belum punya akun? 
      <a class="text-link hover:underline font-medium" href="#" onclick="event.preventDefault();">Hubungi sekolah</a>.
    </p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleBtn.textContent = 'Sembunyikan';
    } else {
      passwordInput.type = 'password';
      toggleBtn.textContent = 'Lihat';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="inline-block animate-pulse">Memverifikasi...</span>';
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1200);
  }
</script></div></main></body></html>
